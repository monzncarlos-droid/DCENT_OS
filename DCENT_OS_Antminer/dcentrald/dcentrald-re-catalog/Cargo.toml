[package]
name = "dcentrald-re-catalog"
version.workspace = true  # Single source: dcentrald/Cargo.toml [workspace.package]
edition = "2021"
license = "GPL-3.0"
description = "Pure no-HAL reverse-engineering catalog for DCENT_OS offline bring-up proofs"

#  W7.1 + W7.2 + W7.3 (DCENT_RE + DCENT_Thermal + DCENT_Perf, 2026-05-07):
#
# STATUS (2026-08-19): OFFLINE EVIDENCE CATALOG. Per
# , research master catalogs have a
# typed Rust mirror here. `model_catalog` carries 27 evidence-tiered board rows,
# `pll_bible` carries nine chip/register expectation rows, and `fan_curves`
# remains an explicitly empty deferred module. Current source -> target mapping:
#
#          -> src/fan_curves.rs
#     -> src/pll_bible.rs
#         -> src/model_catalog.rs
#
# The sole Cargo consumer is the `dcentrald-asic` dev-dependency: its examples
# and golden integration tests consume the typed tables and 13 sidecar vector
# artifacts. No production-default crate consumes this catalog. The API route
# still reads `dcentrald-api-types`; thermal/autotuner integration remains a
# separate review-gated task.
#
# This crate is intentionally HAL-free so Windows/macOS/Linux host tests run
# without an ARM cross-compile and a catalog typo cannot reach `mmap(/dev/mem)`.
# Module tests and the external surface registry pin row counts, representative
# facts, provenance shape, vector hashes, consumers, and ledger scope.

[dependencies]
# Plain serde for optional REST serialization. Never pulls in serde_json
# directly — that's the API crate's responsibility.
serde = { workspace = true }

# W4.7 lint inheritance (DCENT_DevOps + DCENT_QA, 2026-05-07).
# New crate, no grandfather list. Inherit workspace `warn` and keep this
# crate at zero unwrap/panic. Promote to `deny` after one full wave of
# stable usage.
[lints]
workspace = true
