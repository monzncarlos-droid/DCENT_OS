# Track 1 Braiins /tmp mining-on companion — Solo CK (not overlay, not stock).
# Native BM1366 cold-init is still refused. This file is PASSTHROUGH after
# bosminer engage + kill -9 (not S99 stop, which drops GPIO437).
# mining.enabled=true. FLASH stays off. HTTP 8080 / cgminer 14028.

[general]
hostname = "dcent-s19k"
log_level = "info"

[pool]
url = "stratum+tcp://solo.ckpool.org:3333"
worker = "bc1qvsyeswt8lm848rqwfdh3zknc3skgvc8k8w4jyy"
password = "x"
protocol = "sv1"

[mining]
enabled = true
passthrough = true
model = "s19k"
frequency_mhz = 400
voltage_mv = 12800
version_rolling = true
suggest_difficulty = 8192
# Leftover hint only — mining-on always opens ttyS1+ttyS2.
serial_device = "/dev/ttyS1"
serial_chip_count = 77
serial_chip_type = "BM1366"

[platform]
target = "am3-aml-s19k"
board_target = "am3-s19k"

[power]
mode = "bypass"
target_watts = 1400

[power.psu_override]
enabled = true
model = "APW12"
voltage_v = 14.0

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30

[api]
cgminer_port = 14028
http_port = 8080
websocket = true
auth_enabled = false
auth_password = ""

[donation]
enabled = false
percent = 2.0
pool_url = ""
worker = ""
password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true
timeout_s = 30
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false
min_freq_mhz = 250
max_freq_mhz = 650

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
