# DCENT_OS dcentrald config for Antminer S21 XP (Amlogic A113D)
# Package-only management identity. Exact production evidence refutes the
# shared base-S21 ttyS4/NoPic route; model/HAL/install gates refuse execution.
# Platform: Amlogic A113D (aarch64); production PIC/PSU protocols unresolved.
#
# TODO-confirm (live unit needed): S21 XP PSU class may differ from S21 Pro.
# serial_chip_count below follows the exact held A3HB70501 geometry (91 chips
# per hashboard), not the S21 Pro 65-chip hashboard layout. Confirm the complete
# carrier/PSU tuple against a real S21 XP before any flash.
#
# This image is management-only; model/HAL gates refuse hardware construction.

[general]
hostname = "dcent-s21xp"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "s21xp"
# Schema placeholders only; no S21 XP tuning authority is admitted.
frequency_mhz = 480
voltage_mv = 13400
version_rolling = true
passthrough = false
suggest_difficulty = 8192
serial_chip_count = 91
serial_chip_type = "BM1370"

[platform]
target = "am3-aml-s21xp"
board_target = "am3-s21xp"

[power]
mode = "bypass"
target_watts = 3500

[power.psu_override]
enabled = false
model = "APW12"
voltage_v = 14.0

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
auth_enabled = false
auth_password = ""

[donation]
enabled = false
percent = 2.0
pool_url = ""
worker = ""
password = "x"
cycle_duration_s = 3600

[watchdog]
# No S21 XP hardware watchdog, PIC heartbeat, or rail-cut composition is admitted.
enabled = false
timeout_s = 30
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false
min_freq_mhz = 400
max_freq_mhz = 585

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
