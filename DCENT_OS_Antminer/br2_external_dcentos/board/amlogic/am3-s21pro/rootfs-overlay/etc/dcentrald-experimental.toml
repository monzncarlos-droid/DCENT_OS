# /etc/dcentrald-experimental.toml — operator opt-in template (Antminer S21 Pro)
#
# SHIPPED INERT ON PURPOSE. Every key below is commented out, so this file
# parses to exactly the same conservative defaults dcentrald uses when the file
# is absent. A firmware update never grants ASIC execution authority; only an
# operator editing this file does.
#
#   Board target : am3-s21pro          (/etc/dcentos/board_target)
#   Platform     : Amlogic A113D (aarch64), NoPic — TAS5782M DAC, kernel-managed
#   ASIC         : BM1370, chip id 0x1370 (decimal 4976)
#   Parser       : dcentrald/dcentrald/src/experimental.rs
#   Load time    : once, at daemon startup, before any chain is touched.
#                  A missing, unreadable, or malformed file falls back to these
#                  same defaults — it never fails open.
#
# ============================================================================
# executable_asic_chip_ids   (default: [] — nothing is executable)
# ============================================================================
# The ONLY key in this file with a runtime consumer in this image.
#
# An Experimental ASIC driver is always RECOGNIZED. It is not EXECUTABLE:
# without its exact chip id in this list, dcentrald refuses voltage, reset,
# PLL, address-assignment, and work authority, stops before touching the chain,
# and continues in management-only mode (SSH / dashboard / API stay up). Adding
# an id here is the opt-in that grants that authority.
#
# The list is exact per chip id — it is NOT a global "experimental mode".
# Naming one chip never authorizes another family, and the resolved
# `mining.model` in the active dcentrald config (/data/dcentrald.toml when
# present, else /etc/dcentrald.toml) must independently name the same chip.
#
# On this image the only id that can change anything is BM1370:
#
#     0x1370 == 4976        (this board's mining.model = "s21pro")
#
# Write the decimal form. It is the canonical pinned form, and the shipped
# tests assert on it so there is exactly one spelling to review. TOML 1.0 does
# also accept the hex literal 0x1370, and it parses to the identical id --
# this is a one-canonical-form rule, not a claim that hex is rejected.
#
# ----------------------------------------------------------------------------
# READ BEFORE UNCOMMENTING — what "Experimental" means for BM1370 today
# ----------------------------------------------------------------------------
#   * No live BM1370 unit has ever executed this path. The shipped S21 Pro
#     profile is a build-clean scaffold: its own comments record cold-boot
#     frequency/voltage estimated from spec sheets, and `plugo_gpio_base: 0,
#     // TBD`.
#   * Uncommenting the line below is precisely what lets dcentrald drive a
#     real, energized chain with that unvalidated profile.
#   * Do it only on a bench unit you can physically power-cut; leave the
#     thermal and fan limits in the active dcentrald config at their
#     shipped values; and watch the daemon log through the whole bring-up.
#   * The decision is re-read from this file at every startup and nothing is
#     cached. To return to refusal, re-comment the line or delete this file.
#   * PERSISTENCE: this Amlogic image boots a gzip-CPIO initramfs, so /etc is
#     tmpfs. An edit made on a running unit therefore applies until the next
#     reboot only — this file has no /data fallback the way the main config
#     has /data/dcentrald.toml. A reboot returns the unit to refusal.
#
# executable_asic_chip_ids = [4976]
#
#
# ============================================================================
# Remaining keys — parsed, but with NO production consumer in this image
# ============================================================================
# Listed so the schema is discoverable and so a future image can be diffed
# against it. Setting any of them today changes nothing at runtime. Do not
# treat them as available knobs.
#
# rambo_mode_max_bad_responses (integer, default 0)
#   Tolerated bad / missing chip replies during BM1366 chain enumeration.
#   Inert here twice over: it is BM1366-only, and this is a BM1370 board.
# rambo_mode_max_bad_responses = 0
#
# allow_disabling_hashboards_on_nopic_miners (boolean, default false)
#   Reserved. Would mark one dead chain disabled for tuner purposes on a NoPic
#   miner whose shared rail cannot be cut per board.
# allow_disabling_hashboards_on_nopic_miners = false
#
# min_fan_pwm_floor (integer, default 25)
#   Reserved fan-PWM floor for unreliable-tach fallback. The [thermal] section
#   of the active dcentrald config is the real fan authority in this image.
# min_fan_pwm_floor = 25
#
# disable_bootstrap_check (boolean, default false)
#   Reserved for the autotuner bootstrap-voltage check DCENT_OS does not run.
# disable_bootstrap_check = false
#
# send_dummy_telemetry_on_startup (boolean, default false)
#   Reserved one-shot pool / dashboard pipeline probe.
# send_dummy_telemetry_on_startup = false
