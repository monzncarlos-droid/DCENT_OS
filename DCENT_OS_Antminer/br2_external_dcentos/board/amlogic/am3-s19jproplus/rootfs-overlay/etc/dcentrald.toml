# Package and guarded-install A113D identity for Antminer S19j Pro+.
# Exact held identity: fw-info model=s19jpro-plus/platform=aml/install_type=nand,
# shared BM1362 A113D kernel/DTB bytes, BHB42612 stock hashboard identity.

[general]
hostname = "dcentos-s19jproplus"
log_level = "info"

[mining]
enabled = false
model = "s19jproplus"
chip = "BM1362"
chips_per_chain = 120
chains = 3
frequency_mhz = 550
voltage_mv = 13400
version_rolling = true
passthrough = false
suggest_difficulty = 8192
serial_device = "/dev/ttyS2"
serial_chip_count = 120
serial_chip_type = "BM1362"

[platform]
target = "am3-aml-s19jproplus"

[pool]
url = ""
worker = ""
password = "x"

[thermal]
target_temp_c = 65.0
hot_temp_c = 75.0
dangerous_temp_c = 88.0
fan_min_pwm = 10
fan_max_pwm = 30

[watchdog]
enabled = true
timeout_s = 30
kick_interval_s = 5

[hash_on_disconnect]
enabled = true

[mode]
active = "home"

[autotuner]
enabled = false
