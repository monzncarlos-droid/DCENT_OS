[package]
name = "dcentrald-avalon-asic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Avalon industrial ASIC chain driver for DCENT_OS — mm_pkg shim over SysV msgq, multi-hashboard via TCA9546A I2C mux"

[lib]
name = "dcentrald_avalon_asic"
path = "src/lib.rs"

[dependencies]
dcent-avalon-proto.workspace = true
# AsicDriver trait + associated types. Same shared trait as DCENT_axe Avalon —
# both home and industrial Avalon impls satisfy it so the dispatcher in
# dcentaxe-mining can drive either. Crosses DCENT_OS / DCENT_axe family
# boundaries deliberately: the trait is the canonical Bitcoin ASIC abstraction,
# not BitAxe-specific. See plan §B.3.
dcentaxe-asic = { path = "../../../../DCENT_OS_ESP/dcentaxe-asic", features = ["asic-avalon"] }
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
