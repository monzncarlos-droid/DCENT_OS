[package]
name = "dcentaxe-nano3s"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "DCENT_axe Avalon — Linux little-core daemon for Canaan Avalon Nano 3 / Nano 3S / Mini 3 (K230 RISC-V)"

[[bin]]
name = "dcentaxe-nano3s"
path = "src/main.rs"

[dependencies]
dcentaxe-nano3s-hal = { path = "../dcentaxe-nano3s-hal" }
dcentaxe-nano3s-asic = { path = "../dcentaxe-nano3s-asic" }
dcent-avalon-proto.workspace = true

# Cross-workspace shared crates from BitAxe (DCENT_axe family). The
# dcentaxe-mining + dcentaxe-stratum crates are 100% portable per Plan 1's
# Phase 1 Explore agent report — no esp-idf deps. dcentaxe-asic provides
# the AsicDriver trait; we enable the `asic-avalon` feature so the AsicModel
# enum exposes the Avalon variant our shim driver reports.
dcentaxe-asic    = { path = "../../../DCENT_OS_ESP/dcentaxe-asic", features = ["asic-avalon"] }
dcentaxe-mining  = { path = "../../../DCENT_OS_ESP/dcentaxe-mining", features = ["asic-avalon"] }
dcentaxe-stratum = { path = "../../../DCENT_OS_ESP/dcentaxe-stratum" }

tokio.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
